name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project and add Stakebook code
        run: |
          flutter create --platforms=android --project-name stakebook --org com.stakebook app
          rm -rf app/lib
          cp -r lib app/lib
          cd app
          flutter pub add provider shared_preferences path_provider share_plus:^11.0.0 file_picker:^8.1.2
          grep -q allowBackup android/app/src/main/AndroidManifest.xml || \
            sed -i 's/<application/<application android:allowBackup="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: stakebook-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
